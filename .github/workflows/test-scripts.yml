name: Test scripts

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-update-common-skills-lock:
    name: Test update_common_skills_lock
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run update_common_skills_lock regression tests
        run: scripts/tests/update_common_skills_lock_test.sh
